version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DB_HOST: 172.23.0.1
        DB_PORT: 5432
        DB_NAME: empresa
        DB_USER: postgres
        DB_PASSWORD: admin
    container_name: empresa-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://172.23.0.1:5432/empresa
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - empresa-network
    restart: unless-stopped

  llama-api:
    image: ollama/ollama:latest
    container_name: empresa-llama-api
    ports:
      - "11434:11434"
    volumes:
      - llama_data:/root/.ollama
    networks:
      - empresa-network
    restart: unless-stopped

networks:
  empresa-network:
    driver: bridge

volumes:
  llama_data: