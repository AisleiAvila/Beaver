<section class="how-it-works">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center mb-12">
      {{ "howItWorks.title" | translate }}
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      <div *ngFor="let step of steps" class="how-it-works__step">
        <div class="how-it-works__icon" [ngClass]="'step' + step.index">
          <fa-icon [icon]="step.icon"></fa-icon>
        </div>
        <h3
          class="how-it-works__title font-bold"
          [attr.data-number]="step.index + '.'"
        >
          {{ step.title | translate }}
        </h3>
        <p class="how-it-works__description">
          {{ step.description | translate }}
        </p>
      </div>
    </div>
  </div>
</section>
