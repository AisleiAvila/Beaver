<section class="faq-section">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center mb-12">
      {{ "faq.title" | translate }}
    </h2>

    <div class="max-w-3xl mx-auto space-y-4">
      <div
        *ngFor="let item of faqItems"
        class="faq-item bg-white rounded-lg shadow-md overflow-hidden"
      >
        <button
          class="faq-question w-full text-left px-6 py-4 font-medium text-gray-800 hover:bg-gray-50 focus:outline-none"
          (click)="toggleFaq(item.id)"
        >
          <div class="flex justify-between items-center">
            <span>{{ item.question | translate }}</span>
            <fa-icon
              [icon]="faChevronDown"
              class="transform transition-transform duration-300"
              [class.rotate-180]="item.isOpen"
            ></fa-icon>
          </div>
        </button>
        <div
          class="faq-answer px-6 pb-4 text-gray-600"
          [class.hidden]="!item.isOpen"
        >
          <p>{{ item.answer | translate }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
