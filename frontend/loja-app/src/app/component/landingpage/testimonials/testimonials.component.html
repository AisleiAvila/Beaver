<section class="py-16 bg-gray-50">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center mb-12">
      {{ "testimonials.title" | translate }}
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div *ngFor="let testimonial of testimonials" class="testimonial">
        <p class="rating text-yellow-500 flex justify-center mb-4">
          <span *ngFor="let star of [].constructor(testimonial.rating)">
            <fa-icon [icon]="faStar"></fa-icon>
          </span>
        </p>
        <p class="feedback text-center">{{ testimonial.feedback }}</p>
        <p class="name text-center font-bold">- {{ testimonial.name }}</p>
      </div>
    </div>
  </div>
</section>
