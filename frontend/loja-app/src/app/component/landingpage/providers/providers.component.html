<section class="providers">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center mb-12">
      {{ "providers.title" | translate }}
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let provider of providers" class="providers__card">
        <div class="providers__icon">
          <fa-icon [icon]="provider.icon"></fa-icon>
        </div>
        <h3 class="providers__title">
          {{ provider.title | translate }}
        </h3>
        <p class="providers__description">
          {{ provider.description | translate }}
        </p>
      </div>
    </div>
  </div>
</section>
