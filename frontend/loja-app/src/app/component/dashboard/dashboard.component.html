<main class="main">
  <div class="container">
    <div class="dashboard-header">
      <h2>{{ "TITLE_PAINEL" | translate }}</h2>
    </div>
    <div class="main-content">
      <div class="dashboard-container">
        <div class="dashboard">
          <div class="card" *ngFor="let func of functionalities">
            <img [src]="func.image" alt="{{ func.name }}" />
            <h3>
              <a [routerLink]="func.route">{{ func.name }}</a>
            </h3>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
