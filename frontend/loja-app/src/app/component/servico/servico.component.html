<main class="main-container">
  <div class="content-wrapper">
    <h2 class="page-title">{{ titulo | translate }}</h2>

    <div class="form-container">
      <div class="form-row">
        <!-- Step 1: Service Description -->

        <div *ngIf="currentStep === 1">
          <div class="form-row align-items">
            <h3>Descreva o serviço que você precisa</h3>
            <textarea
              [(ngModel)]="serviceData.description"
              rows="5"
              class="text-area w-9/10"
              placeholder="Ex: Preciso de um encanador para consertar um vazamento na cozinha. O problema começou há 3 dias e está piorando..."
            ></textarea>
          </div>

          <div class="form-action">
            <button
              type="button"
              color="primary"
              (click)="nextStep()"
              [disabled]="!serviceData.description"
              class="px-8 py-3 rounded-lg transition flex items-center shadow-md"
              [ngClass]="{
                'button-enabled': serviceData.description,
                'button-disabled': !serviceData.description
              }"
            >
              Próximo <i class="fas fa-arrow-right ml-3"></i>
            </button>
          </div>
        </div>

        <!-- Step 2: Service Type -->
        <div *ngIf="currentStep === 2">
          <div class="form-row align-items">
            <h3>Selecione o tipo de serviço</h3>
            <div class="grid grid-cols-2 gap-6 mb-8">
              <div
                *ngFor="let service of serviceTypes"
                (click)="selectServiceType(service)"
                (keydown.enter)="selectServiceType(service)"
                tabindex="0"
                class="service-card p-5 border rounded-lg cursor-pointer transition hover:shadow-lg"
                [ngClass]="{
                  'border-blue-500': serviceData.type === service.value,
                  selected: serviceData.type === service.value
                }"
              >
                <div class="flex items-center">
                  <div class="p-3 bg-gray-100 rounded-full mr-4">
                    <i class="fas" [class]="service.icon"></i>
                  </div>
                  <div>
                    <h4 class="font-medium text-gray-800">
                      {{ service.label }}
                    </h4>
                    <p class="text-sm text-gray-500">
                      {{ service.description }}
                    </p>
                  </div>
                </div>
              </div>
            </div>
            <div class="form-action">
              <button
                type="button"
                color="primary"
                (click)="prevStep()"
                class="button-enabled"
              >
                <i class="fas fa-arrow-left mr-3"></i> Voltar
              </button>
              <button
                type="button"
                color="primary"
                (click)="nextStep()"
                [ngClass]="{
                  'button-enabled': serviceData.type,
                  'button-disabled': !serviceData.type
                }"
              >
                Próximo <i class="fas fa-arrow-right ml-3"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
